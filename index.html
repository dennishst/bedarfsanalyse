<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makerport — Bedarfsanalyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#33475B;        /* HubSpot navy (body/headline text) */
    --paper:#F5F8FA;       /* HubSpot canvas gray */
    --card:#FFFFFF;
    --line:#CBD6E2;        /* HubSpot border gray */
    --muted:#516F90;       /* HubSpot muted text */
    --orange:#FF7A59;      /* HubSpot primary CTA orange */
    --orange-dark:#E66E50;
    --teal:#00A4BD;        /* HubSpot secondary teal */
    --teal-dark:#00879C;
    --indigo:#6A78D1;      /* HubSpot secondary indigo */
    --indigo-dark:#5563C0;
    --accent: var(--orange);
    --accent-dark: var(--orange-dark);
    --accent-soft:#FFF1EC;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  #app{
    max-width: 800px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:20px;
    margin-bottom:28px;
  }
  .wordmark{
    font-family:'Lexend Deca', sans-serif;
    font-size:1.05rem;
    font-weight:600;
    color:var(--ink);
  }
  .wordmark span{ color:var(--orange); }
  .kicker{
    font-size:0.8rem;
    color:var(--muted);
    font-weight:500;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px 12px;
    white-space:nowrap;
  }

  /* ---------- Intro ---------- */
  .hero-question{
    font-family:'Lexend Deca', sans-serif;
    font-size:2rem;
    line-height:1.3;
    font-weight:600;
    max-width: 26ch;
    margin:0 0 28px;
    animation: fade-in 0.45s ease both;
    letter-spacing:-0.01em;
  }
  @keyframes fade-in{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  .paths{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:12px;
  }
  .path-card{
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--card);
    box-shadow: 0 1px 2px rgba(33,49,74,0.06);
    padding:24px 18px;
    cursor:pointer;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    font-family:inherit;
    color:inherit;
    min-width:0;
  }
  .path-card:hover, .path-card:focus-visible{
    box-shadow: 0 4px 12px rgba(33,49,74,0.10);
    border-color: var(--role-accent);
    outline:none;
  }
  .path-card:focus-visible{ box-shadow: 0 0 0 3px rgba(255,122,89,0.3); }
  .path-icon{
    width:34px; height:34px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Lexend Deca', sans-serif;
    font-weight:700;
    font-size:0.9rem;
    color:#fff;
    background: var(--role-accent);
    flex:none;
  }
  .path-title{
    font-family:'Lexend Deca', sans-serif;
    font-size:1.05rem;
    font-weight:600;
    line-height:1.3;
  }
  .path-desc{
    font-size:0.85rem;
    color:var(--muted);
    line-height:1.5;
  }
  .path-cta{
    font-family:'Lexend Deca', sans-serif;
    font-size:0.8rem;
    font-weight:600;
    margin-top:auto;
    padding-top:6px;
    color: var(--role-accent);
  }
  @media (max-width:700px){
    .hero-question{ font-size:1.4rem; }
    .path-card{ padding:16px 12px; gap:8px; }
    .path-title{ font-size:0.88rem; }
    .path-desc{ display:none; }
    .path-cta{ font-size:0.72rem; }
    .path-icon{ width:26px; height:26px; font-size:0.75rem; border-radius:6px; }
    .paths{ gap:8px; }
  }
  @media (max-width:460px){
    .path-title{ font-size:0.76rem; }
    .path-card{ padding:12px 8px; }
  }

  /* ---------- Progress rail ---------- */
  .rail-wrap{ margin-bottom:24px; }
  .rail-meta{
    display:flex;
    justify-content:space-between;
    font-size:0.8rem;
    color:var(--muted);
    margin-bottom:10px;
    font-weight:500;
  }
  .rail-meta strong{ color:var(--ink); font-weight:600; }
  .rail{
    position:relative;
    height:6px;
    background:var(--line);
    border-radius:999px;
    overflow:hidden;
  }
  .rail-fill{
    position:absolute;
    top:0; left:0; height:100%;
    background:var(--accent);
    border-radius:999px;
    transition: width 0.35s ease;
  }
  .rail-ticks{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
  }
  .rail-tick{
    font-size:0.72rem;
    color:var(--line);
    font-weight:500;
    background:none;
    border:none;
    padding:0;
    font-family:inherit;
    cursor:default;
  }
  .rail-tick.done{ color:var(--muted); }
  .rail-tick.active{ color:var(--accent); font-weight:700; }
  .rail-tick.clickable{ cursor:pointer; }
  .rail-tick.clickable:hover{ text-decoration:underline; }
  .rail-tick.clickable:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- Card shell (question / success / bonus / recommend / feedback / thanks) ---------- */
  .panel-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow: 0 1px 2px rgba(33,49,74,0.06);
    padding:32px;
    animation: fade-in 0.3s ease both;
  }
  @media (max-width:600px){ .panel-card{ padding:20px; } }
  .q-eyebrow{
    font-family:'Lexend Deca', sans-serif;
    font-size:0.78rem;
    font-weight:600;
    color:var(--accent);
    margin-bottom:10px;
  }
  .q-title{
    font-family:'Lexend Deca', sans-serif;
    font-size:1.35rem;
    line-height:1.4;
    font-weight:600;
    margin:0 0 6px;
    color:var(--ink);
  }
  .q-hint{
    font-size:0.85rem;
    color:var(--muted);
    margin:0 0 20px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:6px;
    cursor:pointer;
    background:var(--card);
    text-align:left;
    font-family:inherit;
    font-size:0.98rem;
    color:var(--ink);
    transition: background-color 0.12s ease, border-color 0.12s ease;
    width:100%;
  }
  .option:hover{ border-color: var(--accent); background: var(--accent-soft); }
  .option:focus-visible{ outline:none; box-shadow: 0 0 0 3px rgba(255,122,89,0.25); }
  .option-main{ display:flex; flex-direction:column; gap:3px; }
  .option-desc{ font-size:0.84rem; color:var(--muted); font-weight:400; line-height:1.4; }

  .dot{
    flex:none;
    width:18px; height:18px;
    margin-top:1px;
    border-radius:50%;
    border:2px solid var(--line);
    position:relative;
    transition: border-color 0.12s ease;
  }
  .option.selected .dot{ border-color:var(--accent); }
  .option.selected .dot::after{
    content:"";
    position:absolute;
    top:3px; left:3px; right:3px; bottom:3px;
    border-radius:50%;
    background:var(--accent);
  }
  .check{
    flex:none;
    width:18px; height:18px;
    margin-top:1px;
    border-radius:4px;
    border:2px solid var(--line);
    position:relative;
    background:var(--card);
    transition: border-color 0.12s ease, background-color 0.12s ease;
  }
  .option.selected .check{ border-color:var(--accent); background:var(--accent); }
  .option.selected .check::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:4px; height:9px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .option.selected{ border-color:var(--accent); background:var(--accent-soft); font-weight:600; }
  .option.selected .option-desc{ font-weight:400; }

  .other-input{
    margin-top:10px;
    margin-left:32px;
    width:calc(100% - 32px);
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:6px;
    font-family:inherit;
    font-size:0.92rem;
    color:var(--ink);
    background:var(--card);
  }
  .other-input:focus{ outline:none; border-color:var(--accent); }
  @media (max-width:460px){ .other-input{ margin-left:0; width:100%; } }

  /* ---------- Groups (Zeitbudget / Bonus-Angaben) ---------- */
  .group-block{ margin-bottom:26px; }
  .group-block:last-child{ margin-bottom:0; }
  .group-label{
    font-family:'Lexend Deca', sans-serif;
    font-size:0.85rem;
    font-weight:600;
    color:var(--ink);
    margin-bottom:12px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    padding:9px 16px;
    border:1.5px solid var(--line);
    border-radius:999px;
    background:var(--card);
    font-family:inherit;
    font-size:0.88rem;
    color:var(--ink);
    cursor:pointer;
    transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .chip:hover{ border-color:var(--accent); }
  .chip:focus-visible{ outline:none; box-shadow:0 0 0 3px rgba(255,122,89,0.25); }
  .chip.selected{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }

  /* ---------- Textarea ---------- */
  .textarea{
    width:100%;
    min-height:120px;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:6px;
    font-family:inherit;
    font-size:0.98rem;
    color:var(--ink);
    resize:vertical;
    background:var(--card);
  }
  .textarea:focus{ outline:none; border-color:var(--accent); }
  .textarea::placeholder{ color:#93A6BA; }

  /* ---------- Nav ---------- */
  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:28px;
  }
  .btn{
    font-family:'Lexend Deca', sans-serif;
    font-size:0.9rem;
    font-weight:600;
    border:none;
    cursor:pointer;
    padding:11px 20px;
    border-radius:4px;
  }
  .btn-back{ color:var(--muted); background:none; padding:11px 4px; }
  .btn-back:hover{ color:var(--ink); }
  .btn-next{
    background:var(--accent);
    color:#fff;
    padding:11px 28px;
    transition: background-color 0.12s ease;
  }
  .btn-next:disabled{
    background:#CBD6E2;
    color:#8FA3B8;
    cursor:not-allowed;
  }
  .btn-next:not(:disabled):hover{ background:var(--accent-dark); }
  .btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .sheet-index{
    font-size:0.75rem;
    color:var(--muted);
    margin-top:20px;
    text-align:right;
  }

  /* ---------- Success / thanks / bonus-intro / recommend screens ---------- */
  .panel-head{
    font-family:'Lexend Deca', sans-serif;
    font-size:1.5rem;
    font-weight:600;
    margin:0 0 8px;
    color:var(--ink);
  }
  .panel-sub{
    color:var(--muted);
    font-size:0.98rem;
    line-height:1.55;
    margin-bottom:0;
  }
  .panel-divider{
    border:none;
    border-top:1px solid var(--line);
    margin:28px 0;
  }
  .upsell-title{
    font-family:'Lexend Deca', sans-serif;
    font-size:1.1rem;
    font-weight:600;
    margin:0 0 8px;
    color:var(--ink);
  }
  .cta-row{
    display:flex;
    align-items:center;
    gap:18px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .btn-cta{
    font-family:'Lexend Deca', sans-serif;
    font-size:0.92rem;
    font-weight:600;
    border:none;
    cursor:pointer;
    padding:12px 26px;
    border-radius:4px;
    background:var(--accent);
    color:#fff;
    transition: background-color 0.12s ease;
    text-decoration:none;
    display:inline-block;
  }
  .btn-cta:hover{ background:var(--accent-dark); }
  .skip-link{
    font-family:'Lexend Deca', sans-serif;
    font-size:0.85rem;
    font-weight:600;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
  }
  .skip-link:hover{ color:var(--ink); }

  /* ---------- Recommend (Ja/Nein) ---------- */
  .choice-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:480px){ .choice-row{ grid-template-columns:1fr; } }
  .choice-btn{
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--card);
    padding:26px 20px;
    text-align:center;
    cursor:pointer;
    font-family:'Lexend Deca', sans-serif;
    font-size:1.05rem;
    font-weight:600;
    color:var(--ink);
    transition: border-color 0.12s ease, background-color 0.12s ease;
  }
  .choice-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .choice-btn:focus-visible{ outline:none; box-shadow:0 0 0 3px rgba(255,122,89,0.25); }

  .restart-link{
    font-family:'Lexend Deca', sans-serif;
    font-size:0.85rem;
    font-weight:600;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    margin-top:24px;
    display:inline-block;
  }
  .restart-link:hover{ color:var(--ink); }

  /* ---------- Newsletter opt-in (on thank-you screens) ---------- */
  .newsletter-block{ margin-top:28px; padding-top:24px; border-top:1px solid var(--line); }
  .check-row{
    display:inline-flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    font-family:inherit;
    font-size:0.92rem;
    color:var(--ink);
    text-align:left;
  }
  .check-row.selected .check{ border-color:var(--accent); background:var(--accent); }
  .check-row.selected .check::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:4px; height:9px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .newsletter-form{
    display:flex;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .newsletter-form[hidden]{ display:none; }
  .newsletter-email{
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:6px;
    font-family:inherit;
    font-size:0.92rem;
    color:var(--ink);
    background:var(--card);
    flex:1;
    min-width:200px;
  }
  .newsletter-email:focus{ outline:none; border-color:var(--accent); }
  .newsletter-success{
    margin-top:14px;
    font-size:0.9rem;
    font-weight:600;
    color:var(--teal);
  }
</style>
</head>

  let state = { stage:'intro', role:null, path:null, step:0, answers:{}, bonus:{}, feedback:'' };

  function setRole(roleId){
    const role = ROLES.find(r => r.id === roleId);
    state = { stage:'form', role:roleId, path:role.path, step:0, answers:{}, bonus:{}, feedback:'' };
    const a = ACCENTS[role.accent];
    document.documentElement.style.setProperty('--accent', a.base);
    document.documentElement.style.setProperty('--accent-dark', a.dark);
    document.documentElement.style.setProperty('--accent-soft', a.soft);
    render();
  }

  function isStepComplete(q){
    if(q.kind === 'single') return !!state.answers[q.id];
    if(q.kind === 'multi') return (state.answers[q.id] || []).length > 0;
    return true; // groups & text steps are optional
  }

  function updateNextButton(q){
    const btn = document.getElementById('next-btn');
    if(btn) btn.disabled = !isStepComplete(q);
  }

  /* ---- Targeted (non-full-rerender) interaction handlers: keep the
     screen still while ticking a box; only navigation re-renders. ---- */

  function handleSingleClick(q, btnEl, container){
    state.answers[q.id] = btnEl.dataset.value;
    container.querySelectorAll('.option').forEach(el => {
      el.classList.toggle('selected', el === btnEl);
    });
    updateNextButton(q);
  }

  function handleMultiClick(q, btnEl){
    const value = btnEl.dataset.value;
    const arr = state.answers[q.id] || (state.answers[q.id] = []);
    const i = arr.indexOf(value);
    const nowSelected = i === -1;
    if(nowSelected) arr.push(value); else arr.splice(i,1);
    btnEl.classList.toggle('selected', nowSelected);

    const opt = q.options.find(o => (typeof o === 'string' ? o : o.value) === value);
    if(opt && opt.other){
      let input = btnEl.nextElementSibling;
      const hasInput = input && input.classList && input.classList.contains('other-input');
      if(nowSelected && !hasInput){
        btnEl.insertAdjacentHTML('afterend', `<input type="text" class="other-input" placeholder="Kurz beschreiben …" value="${escapeHtml(state.answers[q.id+'__other']||'')}" />`);
        const newInput = btnEl.nextElementSibling;
        newInput.addEventListener('input', e => { state.answers[q.id+'__other'] = e.target.value; });
        newInput.addEventListener('click', e => e.stopPropagation());
      } else if(!nowSelected && hasInput){
        input.remove();
      }
    }
    updateNextButton(q);
  }

  function handleGroupClick(store, fullKey, btnEl, group, containerSelectorEl){
    const value = btnEl.dataset.value;
    const arr = store[fullKey] || (store[fullKey] = []);
    const i = arr.indexOf(value);
    const nowSelected = i === -1;
    if(group.multiple === false){
      // single-select chip group: clear siblings first
      arr.length = 0;
      if(containerSelectorEl){
        containerSelectorEl.querySelectorAll('[data-group="'+fullKey+'"]').forEach(el => el.classList.remove('selected'));
      }
      if(nowSelected){ arr.push(value); btnEl.classList.add('selected'); }
    } else {
      if(nowSelected) arr.push(value); else arr.splice(i,1);
      btnEl.classList.toggle('selected', nowSelected);
    }
  }

  function setTextAnswer(qid, text){
    state.answers[qid] = text;
  }

  function next(){
    const qs = QUESTIONS[state.path];
    if(state.step < qs.length - 1){
      state.step++;
      render();
    } else {
      state.stage = 'success';
      render();
    }
  }

  function back(){
    if(state.step > 0){ state.step--; render(); }
    else { state = { stage:'intro', role:null, path:null, step:0, answers:{}, bonus:{}, feedback:'' }; render(); }
  }

  function restart(){
    state = { stage:'intro', role:null, path:null, step:0, answers:{}, bonus:{}, feedback:'' };
    render();
  }

  function goBonus(){ state.stage = 'bonus'; render(); }
  function skipBonus(){ state.stage = 'recommend'; render(); }
  function bonusNext(){ state.stage = 'recommend'; render(); }
  function bonusBack(){ state.stage = 'success'; render(); }
  function recommendBack(){ state.stage = 'success'; render(); }
  function chooseRecommend(value){
    state.recommend = value;
    state.stage = value === 'ja' ? 'thanks-google' : 'feedback';
    render();
  }
  function feedbackBack(){ state.stage = 'recommend'; render(); }
  function submitFeedback(){ state.stage = 'thanks-feedback'; render(); }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderTopbar(){
    return `<div class="topbar">
      <div class="wordmark">Maker<span>port</span></div>
      <div class="kicker">Bedarfsanalyse</div>
    </div>`;
  }

  function renderIntro(){
    const cards = ROLES.map(r => `
      <button class="path-card" data-role="${r.id}" style="--role-accent:${ACCENTS[r.accent].base}">
        <div class="path-icon">${r.badge}</div>
        <div class="path-title">${r.title}</div>
        <div class="path-desc">${r.desc}</div>
        <div class="path-cta">Auswählen</div>
      </button>
    `).join('');
    return `
      ${renderTopbar()}
      <div class="hero-question">In welcher Rolle bist du heute hier?</div>
      <div class="paths">${cards}</div>
    `;
  }

  function renderRail(){
    const qs = QUESTIONS[state.path];
    const total = qs.length;
    const pct = (state.step / (total - 1)) * 100;
    const label = ROLES.find(r => r.id === state.role).title;
    const ticks = qs.map((q,i)=>{
      let cls = 'rail-tick';
      if(i < state.step) cls += ' done clickable';
      if(i === state.step) cls += ' active clickable';
      if(i <= state.step){
        return `<button type="button" class="${cls}" data-step="${i}">${q.tick}</button>`;
      }
      return `<div class="${cls}">${q.tick}</div>`;
    }).join('');
    return `
      <div class="rail-wrap">
        <div class="rail-meta"><span>${label}</span><strong>Schritt ${state.step+1} / ${total}</strong></div>
        <div class="rail"><div class="rail-fill" style="width:${pct}%"></div></div>
        <div class="rail-ticks">${ticks}</div>
      </div>
    `;
  }

  function renderSingleOrMultiOption(q, opt, isMulti){
    const value = typeof opt === 'string' ? opt : opt.value;
    const desc = typeof opt === 'string' ? null : opt.desc;
    const isOther = typeof opt === 'object' && opt.other;
    const selected = isMulti
      ? (state.answers[q.id] || []).includes(value)
      : state.answers[q.id] === value;
    const indicator = isMulti ? `<span class="check"></span>` : `<span class="dot"></span>`;
    const otherVal = state.answers[q.id + '__other'] || '';
    const otherField = (isOther && selected) ? `
      <input type="text" class="other-input" data-other-for="${q.id}" placeholder="Kurz beschreiben …" value="${escapeHtml(otherVal)}" />
    ` : '';
    return `
      <button class="option${selected?' selected':''}" data-value="${escapeHtml(value)}">
        ${indicator}
        <span class="option-main">
          <span>${escapeHtml(value)}</span>
          ${desc ? `<span class="option-desc">${escapeHtml(desc)}</span>` : ''}
        </span>
      </button>
      ${otherField}
    `;
  }

  function renderGroupsBlock(groups, store, keyPrefix){
    return groups.map(g => {
      const fullKey = keyPrefix + g.key;
      if(g.layout === 'chips'){
        const chips = g.options.map(opt => {
          const selected = (store[fullKey] || []).includes(opt);
          return `<button class="chip${selected?' selected':''}" data-group="${fullKey}" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`;
        }).join('');
        return `<div class="group-block"><div class="group-label">${g.label}</div><div class="chip-row">${chips}</div></div>`;
      } else {
        const items = g.options.map(opt => {
          const selected = (store[fullKey] || []).includes(opt.value);
          return `<button class="option${selected?' selected':''}" data-group="${fullKey}" data-value="${escapeHtml(opt.value)}">
            <span class="check"></span>
            <span class="option-main"><span>${escapeHtml(opt.value)}</span><span class="option-desc">${escapeHtml(opt.desc)}</span></span>
          </button>`;
        }).join('');
        return `<div class="group-block"><div class="group-label">${g.label}</div><div class="options">${items}</div></div>`;
      }
    }).join('');
  }

  function renderQuestion(){
    const qs = QUESTIONS[state.path];
    const q = qs[state.step];
    const isLast = state.step === qs.length - 1;
    const complete = isStepComplete(q);

    let body = '';
    if(q.kind === 'single'){
      body = `<div class="options">${q.options.map(o => renderSingleOrMultiOption(q, o, false)).join('')}</div>`;
    } else if(q.kind === 'multi'){
      body = `<div class="options">${q.options.map(o => renderSingleOrMultiOption(q, o, true)).join('')}</div>`;
    } else if(q.kind === 'groups'){
      body = renderGroupsBlock(q.groups, state.answers, q.id + '__');
    } else if(q.kind === 'text'){
      const val = state.answers[q.id] || '';
      body = `<textarea class="textarea" id="text-answer" placeholder="${escapeHtml(q.placeholder||'')}">${escapeHtml(val)}</textarea>`;
    }

    return `
      ${renderTopbar()}
      ${renderRail()}
      <div class="panel-card">
        <div class="q-eyebrow">${q.eyebrow}</div>
        <div class="q-title">${q.question}</div>
        ${q.hint ? `<div class="q-hint">${q.hint}</div>` : `<div class="q-hint">&nbsp;</div>`}
        ${body}
        <div class="nav">
          <button class="btn btn-back" id="back-btn">Zurück</button>
          <button class="btn btn-next" id="next-btn" ${complete ? '' : 'disabled'}>${isLast ? 'Absenden' : 'Weiter'}</button>
        </div>
      </div>
      <div class="sheet-index">Schritt ${state.step+1} von ${qs.length}</div>
    `;
  }

  function render(){
    const app = document.getElementById('app');

    if(state.stage === 'intro'){
      app.innerHTML = renderIntro();
      app.querySelectorAll('.path-card').forEach(el => {
        el.addEventListener('click', () => setRole(el.dataset.role));
      });

    } else if(state.stage === 'form'){
      app.innerHTML = renderQuestion();
      const q = QUESTIONS[state.path][state.step];

      if(q.kind === 'single'){
        const container = app.querySelector('.panel-card > .options');
        container.querySelectorAll('.option').forEach(el => {
          el.addEventListener('click', () => handleSingleClick(q, el, container));
        });
      } else if(q.kind === 'multi'){
        app.querySelectorAll('.panel-card > .options > .option').forEach(el => {
          el.addEventListener('click', (e) => {
            if(e.target.closest('.other-input')) return;
            handleMultiClick(q, el);
          });
        });
        const otherInput = app.querySelector('.other-input');
        if(otherInput){
          otherInput.addEventListener('input', (e) => { state.answers[q.id+'__other'] = e.target.value; });
          otherInput.addEventListener('click', (e) => e.stopPropagation());
        }
      } else if(q.kind === 'groups'){
        const panel = app.querySelector('.panel-card');
        q.groups.forEach(g => {
          const fullKey = q.id + '__' + g.key;
          panel.querySelectorAll('[data-group="'+fullKey+'"]').forEach(el => {
            el.addEventListener('click', () => handleGroupClick(state.answers, fullKey, el, g, panel));
          });
        });
      } else if(q.kind === 'text'){
        const ta = document.getElementById('text-answer');
        if(ta) ta.addEventListener('input', (e) => setTextAnswer(q.id, e.target.value));
      }

      document.getElementById('back-btn').addEventListener('click', back);
      document.getElementById('next-btn').addEventListener('click', next);
      app.querySelectorAll('.rail-tick.clickable').forEach(el => {
        el.addEventListener('click', () => { state.step = parseInt(el.dataset.step, 10); render(); });
      });

    } else if(state.stage === 'success'){
      app.innerHTML = renderSuccess();
      document.getElementById('bonus-btn').addEventListener('click', goBonus);
      document.getElementById('skip-btn').addEventListener('click', skipBonus);

    } else if(state.stage === 'bonus'){
      app.innerHTML = renderBonus();
      const panel = app.querySelector('.panel-card');
      BONUS_GROUPS.forEach(g => {
        panel.querySelectorAll('[data-group="'+g.key+'"]').forEach(el => {
          el.addEventListener('click', () => handleGroupClick(state.bonus, g.key, el, g, panel));
        });
      });
      document.getElementById('back-btn').addEventListener('click', bonusBack);
      document.getElementById('next-btn').addEventListener('click', bonusNext);

    } else if(state.stage === 'recommend'){
      app.innerHTML = renderRecommend();
      app.querySelectorAll('.choice-btn').forEach(el => {
        el.addEventListener('click', () => chooseRecommend(el.dataset.value));
      });
      document.getElementById('back-btn').addEventListener('click', recommendBack);

    } else if(state.stage === 'feedback'){
      app.innerHTML = renderFeedback();
      const ta = document.getElementById('feedback-answer');
      if(ta) ta.addEventListener('input', (e) => { state.feedback = e.target.value; });
      document.getElementById('back-btn').addEventListener('click', feedbackBack);
      document.getElementById('next-btn').addEventListener('click', submitFeedback);

    } else if(state.stage === 'thanks-feedback'){
      app.innerHTML = renderThanksFeedback();
      document.getElementById('newsletter-toggle-btn').addEventListener('click', toggleNewsletter);
      document.getElementById('newsletter-submit').addEventListener('click', submitNewsletter);

    } else if(state.stage === 'thanks-google'){
      app.innerHTML = renderThanksGoogle();
      document.getElementById('newsletter-toggle-btn').addEventListener('click', toggleNewsletter);
      document.getElementById('newsletter-submit').addEventListener('click', submitNewsletter);
    }
  }

  render();
})();
</script>
</body>
</html>
